name: DTS and Official Macro Radar
on:
  schedule:
    - cron: '45 13,15 * * 1-5'
    - cron: '15 21,22,23 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main, codex/dts-institutional-v6]
    paths: ['scripts/**', 'tests/**', '.github/workflows/**', 'data/consensus.json']
permissions:
  contents: write
concurrency:
  group: dts-data-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify accounting and forecast contracts
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify bilingual interface and expiry rules
        run: node --test tests/test_ui.mjs
      - name: Refresh Treasury cash data
        id: dts
        continue-on-error: true
        run: python scripts/build_dts_nowcast.py
      - name: Refresh official macro series
        id: macro
        continue-on-error: true
        run: python scripts/build_macro_radar.py
      - name: Commit data and failure states
        if: always() && !cancelled()
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: refresh official macro radar [skip netlify]'
          # A code deployment may land while sources are downloading.
          # Rebase this data-only commit onto the current branch; never force-push.
          for attempt in 1 2 3; do
            git fetch origin "$TARGET_BRANCH"
            git rebase "origin/$TARGET_BRANCH"
            if git push origin "HEAD:$TARGET_BRANCH"; then exit 0; fi
          done
          exit 1
      - name: Surface failed refresh
        if: steps.dts.outcome == 'failure' || steps.macro.outcome == 'failure'
        run: exit 1

