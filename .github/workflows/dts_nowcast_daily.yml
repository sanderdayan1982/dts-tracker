name: DTS Fiscal Nowcast Daily

on:
  schedule:
    - cron: '15 21 * * 1-5'
    - cron: '15 22 * * 1-5'
    - cron: '15 23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dts-nowcast-daily
  cancel-in-progress: false

jobs:
  build-nowcast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run DTS Fiscal Nowcast & MMT Liquidity Engine
        run: python3 scripts/build_dts_nowcast.py

      - name: Commit and push static JSON endpoints
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dts_nowcast.json data/dts_history_400d.json
          if git diff --cached --quiet; then
            echo "No new DTS data changes to commit."
            exit 0
          fi
          git commit -m "chore(dts): update daily fiscal nowcast [skip netlify]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break
            sleep 3
          done
