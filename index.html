<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Bilingual US Treasury cash and official macro release radar with transparent research forecasts and data quality controls.">
<meta name="color-scheme" content="dark"><title>DTS Tracker · Fiscal Intelligence</title>
<link rel="stylesheet" href="assets/dashboard.css">
</head>
<body>
<header><div class="topbar"><a class="brand" href="./" aria-label="DTS Tracker"><span class="mark">DTS</span><span><strong id="brandTitle">Fiscal Intelligence</strong><small id="brandSub">US Treasury · Federal Reserve</small></span></a><div class="controls"><button id="refresh" type="button">↻ <span id="refreshText">Refresh</span></button><div class="lang" role="group" aria-label="Language"><button id="langEn" lang="en" aria-pressed="true">EN</button><button id="langEs" lang="es" aria-pressed="false">ES</button></div></div></div></header>
<main class="container">
<section class="intro"><div><div class="eyebrow" id="eyebrow"></div><h1 id="pageTitle"></h1><p id="pageIntro"></p></div><div class="contract" id="contract"></div></section>
<div id="status" class="statusbar" role="status"></div>
<section id="kpis" class="kpis" aria-label="Summary"></section>
<nav id="nav" aria-label="Dashboard"></nav>
<section id="view"></section>
<footer><span id="footerText"></span><span><a href="https://raw.githubusercontent.com/sanderdayan1982/dts-tracker/main/data/argos_summary.json" id="argosLink" target="_blank" rel="noopener">ARGOS JSON</a> · <a href="https://github.com/sanderdayan1982/dts-tracker/blob/main/docs/METHODOLOGY.md" id="docsLink" target="_blank" rel="noopener">Methodology</a></span></footer>
</main>
<dialog id="consensusDialog" aria-labelledby="dialogTitle"><form id="consensusForm">
<h2 id="dialogTitle"></h2><p id="dialogHelp" class="muted"></p><div id="dialogTarget" class="note"></div>
<label id="valueLabel" for="consensusValue"></label><input id="consensusValue" type="number" step="any" required>
<label id="sourceLabel" for="consensusSource"></label><input id="consensusSource" type="text" maxlength="100" required>
<p id="dialogError" class="error" aria-live="polite"></p><div class="dialog-actions"><button id="removeConsensus" type="button"></button><button id="cancelConsensus" type="button"></button><button id="saveConsensus" type="submit"></button></div>
</form></dialog>
<noscript>This dashboard needs JavaScript / Este panel necesita JavaScript.</noscript>
<script type="module" src="assets/app.mjs"></script>
</body></html>
