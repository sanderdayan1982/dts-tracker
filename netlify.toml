[build]
  publish = "."
  # orden Sander 25-nov t388u: DTS ignora commits de datos en Netlify
  # Solo se publica si cambia código/HTML/netlify.toml. La web ya lee de main.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- index.html 'assets/**' netlify.toml"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/assets/*.mjs"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
